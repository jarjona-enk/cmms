# Atlas CMMS — Enerkem production release pipeline
#
# Same shape as ../itsheets/azure-pipelines-1.yml and ../budget/azure-pipelines.yml:
# a release/* tag triggers one job that builds an image, pushes it to
# enerkem.azurecr.io, and attaches it to an EXISTING web app.
#
#   git tag release/1.6.0-enerkem.1 && git push origin release/1.6.0-enerkem.1
#
# ── PRODUCTION ONLY ───────────────────────────────────────────────────────
# One environment. There is no test stage and no test web app; a test/* tag
# does nothing. Production is the hand-built web app `cmms`.
#
# ── NO TESTS. Build, push, deploy. ────────────────────────────────────────
# Owner's decision, 2026-09-15: "remove all the tests you do during the build.
# Just limit to build a working container and deploy it. If it doesn't work we
# will fix it."
#
# So there is no smoke test: nothing starts the image, and nothing checks that
# it serves the SPA, before it is pushed and deployed. A broken image reaches
# production and is fixed forward. The post-deploy check at the end reports
# whether the site came back but never fails the run.
#
# What still guards the run, because neither is a test of the container:
#   - the tag must be release/<upstream>-enerkem.<n> and its upstream half must
#     match UPSTREAM_VERSION (the fork's release policy, see CLAUDE.md)
#   - .azure/env/prod.env must supply every key, or the SPA gets built with the
#     wrong URL baked in
#
# ── This pipeline CREATES NO INFRASTRUCTURE ───────────────────────────────
# The web app, its plan, the storage account and container, the VNet
# integration, the database and the Key Vault were all built by hand and are
# expected to exist. The pipeline builds a container, pushes it, points the app
# at it, pushes the non-secret application settings, and checks the site came
# back. Nothing else.
#
# OpenTofu under infra/ is PARKED for a later release — see infra/README.md.
# Do not add a `tofu` step here.
#
# ── Settings live in .azure/env/prod.env ──────────────────────────────────
# Committed, non-secret: the web app name, the URL baked into the SPA, the
# storage account, the database host, the Entra ids. Edit that file, not this
# one, and not the Azure portal.
#
# ── Secrets are NOT touched by this pipeline ──────────────────────────────
# Same principle as budget: `appSettings` below ADDS/UPDATES only the keys it
# lists, so everything else on the app survives a deploy. DB_PWD,
# JWT_SECRET_KEY and OAUTH2_CLIENT_SECRET are set once by hand as Key Vault
# references and never appear here, in the repo, or in a pipeline variable.
# See REQUIREMENTS.md §2.

trigger:
  # A release/* tag is the only thing that ships; pushing a branch does nothing.
  #
  # Written as a refs/tags/ pattern in `branches.include` rather than as a
  # separate `tags:` block. The earlier form —
  #     branches: {exclude: ['*']}
  #     tags:     {include: ['release/*']}
  # — silently fired nothing: release/1.6.0-enerkem.1 was pushed on 2026-09-13
  # and no run was queued. A branch filter that excludes everything leaves the
  # CI trigger with nothing to match on, and the tag block does not rescue it.
  # Naming the tag ref here is the form Azure DevOps evaluates reliably, and it
  # still excludes ordinary branches because they cannot match refs/tags/*.
  branches:
    include:
      - refs/tags/release/*

pr: none

name: $(Date:yyyyMMdd)$(Rev:.rr)

variables:
  # Service connections in the "New Services Implementations" project.
  #
  # Service connections are PROJECT-SCOPED. The ids itsheets and budget use
  # belong to their own project and do not resolve here, which is why these are
  # the ones verified against this project with
  # `az devops service-endpoint list`.
  #
  # 'DEVOPS - ACR' -> registry `enerkem` (enerkem.azurecr.io). Note the other
  # docker connection in this project, 'Docker Registy connector', points at
  # `sjusiccontainerregistry` and is NOT the one we want.
  - name: dockerRegistryServiceConnection
    value: '784814e7-aa27-4bd8-89dd-31cfbfaa46bc'
  # 'Enterprise (d14f7b8e-d71d-4106-ab93-990c96df467c)', subscription-scoped.
  - name: azureSubscriptionServiceConnection
    value: 'ca8fb3b0-6089-454b-a98e-03739e391ab1'
  - name: acrLoginServer
    value: 'enerkem.azurecr.io'
  # Build context is the REPOSITORY ROOT, not api/. The Dockerfile's first
  # stage zips the whole repo into the image to satisfy AGPLv3 §13.
  - name: dockerfilePath
    value: 'api/Dockerfile'
  - name: buildContext
    value: '.'

jobs:
  - job: Release
    displayName: 'Build and deploy to production'
    pool:
      vmImage: 'ubuntu-latest'
    # The frontend build (npm ci + CRA) plus the Maven reactor runs well over
    # the 60 minute default on a hosted agent.
    timeoutInMinutes: 120
    steps:
      - checkout: self

      # ── Resolve the release ───────────────────────────────────────────────
      # Our tags MUST carry the upstream release number they are built on:
      #   release/<upstream>-enerkem.<n>
      #
      # The upstream half is checked against the UPSTREAM_VERSION file, bumped
      # as part of each upstream release-tag merge. That file is the only
      # reliable source in CI: upstream's own v* tags are deliberately not
      # mirrored into this repo.
      - bash: |
          set -euo pipefail
          fail() { echo "##vso[task.logissue type=error]$1"; exit 1; }

          REF="${BUILD_SOURCEBRANCH#refs/tags/}"
          case "$REF" in
            release/*) VERSION="${REF#release/}" ;;
            refs/heads/*|"")
              fail "This pipeline releases from a tag, and was started on a branch ('${BUILD_SOURCEBRANCH}'). Clicking 'Run pipeline' in the UI queues against the default branch and can never work. Push a tag instead:  git tag release/<upstream>-enerkem.<n> && git push origin release/<upstream>-enerkem.<n>" ;;
            test/*)
              fail "This pipeline is production-only. A test/* tag builds nothing; there is no test environment. Use release/<upstream>-enerkem.<n>." ;;
            *)
              fail "Expected refs/tags/release/<version>, got '${BUILD_SOURCEBRANCH}'." ;;
          esac

          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-enerkem\.[0-9]+$' \
            || fail "Tag must be release/<upstream>-enerkem.<n>, for example release/1.6.0-enerkem.1. Got '${REF}'."

          [ -f UPSTREAM_VERSION ] \
            || fail "UPSTREAM_VERSION is missing from the repository root; it records the upstream release this branch is merged up to."
          UPSTREAM_BASE="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          UPSTREAM_IN_TAG="${VERSION%%-enerkem.*}"

          [ "$UPSTREAM_IN_TAG" = "$UPSTREAM_BASE" ] \
            || fail "Tag claims upstream ${UPSTREAM_IN_TAG} but UPSTREAM_VERSION records ${UPSTREAM_BASE}. Either tag ${UPSTREAM_BASE}-enerkem.<n>, or merge upstream v${UPSTREAM_IN_TAG} and bump UPSTREAM_VERSION in that merge."

          # Deployment settings, from the committed file rather than an Azure
          # DevOps variable group. An undefined $(VAR) in Azure DevOps is left
          # as the literal string "$(VAR)", so a forgotten variable would feed
          # garbage into a build argument instead of failing the run; reading a
          # file lets us check each key by name.
          ENV_FILE='.azure/env/prod.env'
          [ -f "$ENV_FILE" ] || fail "${ENV_FILE} is missing."

          set -a
          # shellcheck disable=SC1091
          . "$ENV_FILE"
          set +a

          for KEY in WEBAPP_NAME WEBAPP_RESOURCE_GROUP IMAGE_REPOSITORY \
                     PUBLIC_URL ENABLE_SSO OAUTH2_PROVIDER; do
            eval "VAL=\${$KEY:-}"
            [ -n "$VAL" ] || fail "${KEY} is empty or missing in ${ENV_FILE}."
          done

          case "$PUBLIC_URL" in
            https://*) ;;
            *) fail "PUBLIC_URL in ${ENV_FILE} must be an https:// URL, got '${PUBLIC_URL}'." ;;
          esac
          case "$PUBLIC_URL" in
            */) fail "PUBLIC_URL in ${ENV_FILE} must not end in a slash, got '${PUBLIC_URL}'." ;;
          esac

          echo "Releasing ${VERSION} (upstream ${UPSTREAM_BASE})"
          echo "  web app: ${WEBAPP_NAME} in ${WEBAPP_RESOURCE_GROUP}"
          echo "  image:   $(acrLoginServer)/${IMAGE_REPOSITORY}:${VERSION}"
          echo "  url:     ${PUBLIC_URL}"

          echo "##vso[task.setvariable variable=releaseVersion]${VERSION}"
          echo "##vso[task.setvariable variable=webAppName]${WEBAPP_NAME}"
          echo "##vso[task.setvariable variable=webAppResourceGroup]${WEBAPP_RESOURCE_GROUP}"
          echo "##vso[task.setvariable variable=imageRepository]${IMAGE_REPOSITORY}"
          echo "##vso[task.setvariable variable=publicUrl]${PUBLIC_URL}"
          echo "##vso[task.setvariable variable=enableSso]${ENABLE_SSO}"
          echo "##vso[task.setvariable variable=oauth2Provider]${OAUTH2_PROVIDER}"

          # Application settings, forwarded to the deploy task below.
          echo "##vso[task.setvariable variable=websitesPort]${WEBSITES_PORT}"
          echo "##vso[task.setvariable variable=springProfile]${SPRING_PROFILES_ACTIVE}"
          echo "##vso[task.setvariable variable=dbUrl]${DB_URL}"
          echo "##vso[task.setvariable variable=dbUser]${DB_USER}"
          echo "##vso[task.setvariable variable=storageType]${STORAGE_TYPE}"
          echo "##vso[task.setvariable variable=storageAccount]${AZURE_STORAGE_ACCOUNT}"
          echo "##vso[task.setvariable variable=storageContainer]${AZURE_STORAGE_CONTAINER}"
          echo "##vso[task.setvariable variable=azureClientId]${AZURE_CLIENT_ID}"
          echo "##vso[task.setvariable variable=oauth2ClientId]${OAUTH2_CLIENT_ID}"
          echo "##vso[task.setvariable variable=oauth2TenantId]${OAUTH2_TENANT_ID}"
          echo "##vso[task.setvariable variable=mailType]${MAIL_TYPE}"
          echo "##vso[task.setvariable variable=smtpHost]${SMTP_HOST}"
          echo "##vso[task.setvariable variable=smtpPort]${SMTP_PORT}"
          echo "##vso[task.setvariable variable=smtpAuth]${SMTP_AUTH}"
          echo "##vso[task.setvariable variable=smtpStartTls]${SMTP_STARTTLS}"
          echo "##vso[task.setvariable variable=smtpFrom]${SMTP_FROM}"
          echo "##vso[task.setvariable variable=mailRecipients]${MAIL_RECIPIENTS}"
          echo "##vso[task.setvariable variable=enableEmail]${ENABLE_EMAIL_NOTIFICATIONS}"
          echo "##vso[task.setvariable variable=invitationViaEmail]${INVITATION_VIA_EMAIL}"
          echo "##vso[task.setvariable variable=enableCors]${ENABLE_CORS}"
          echo "##vso[task.setvariable variable=logFile]${LOG_FILE}"

          echo "##vso[build.updatebuildnumber]prod-${VERSION}"
        displayName: 'Resolve the tag and read .azure/env/prod.env'

      # ── Build ─────────────────────────────────────────────────────────────
      # Everything happens inside the image, so the agent needs no JDK, Node or
      # Maven — unlike itsheets and budget, which build on the agent first.
      # api/Dockerfile stage 1 zips the source bundle for AGPLv3 §13; stage 2
      # (maven:3.9.3-eclipse-temurin-17) runs the whole reactor, with
      # frontend-maven-plugin fetching Node, running npm ci and the CRA
      # production build, copying frontend/build into the api module's
      # classpath:/static, then packaging the fat jar; stage 3 is
      # eclipse-temurin:17-jre-noble carrying sshd on 2222 and startup.sh.
      #
      # Plain `docker build` rather than Docker@2 buildAndPush, deliberately:
      # buildAndPush ignores the `arguments` input, which would silently drop
      # the three --build-arg values below and bake localhost:8080 into the SPA.
      #
      # Tagged with its final names up front. There is no longer anything
      # between build and push, so the old candidate-tag-then-retag step would
      # buy nothing.
      - bash: |
          set -euo pipefail
          docker build \
            --file "$(dockerfilePath)" \
            --tag "$(acrLoginServer)/$(imageRepository):$(releaseVersion)" \
            --tag "$(acrLoginServer)/$(imageRepository):latest" \
            --build-arg FRONTEND_API_URL="$(publicUrl)" \
            --build-arg FRONTEND_ENABLE_SSO="$(enableSso)" \
            --build-arg FRONTEND_OAUTH2_PROVIDER="$(oauth2Provider)" \
            "$(buildContext)"
        displayName: 'Build container image (frontend + API + fat jar)'
        env:
          DOCKER_BUILDKIT: 1

      # ── Publish ───────────────────────────────────────────────────────────
      - task: Docker@2
        displayName: 'Log in to ACR'
        inputs:
          command: login
          containerRegistry: '$(dockerRegistryServiceConnection)'

      # Two tags. :<version> is immutable and is what the web app is pointed at
      # below, so a rollback is a one-line change rather than a rebuild.
      # :latest moves to the newest release, for `docker pull` and the registry
      # UI; nothing deploys from it.
      #
      # NOTE: nothing verifies the image before this point. The image is pushed
      # and deployed as built - a deliberate choice (see the header). A broken
      # build reaches production and is fixed forward.
      - bash: |
          set -euo pipefail
          docker push "$(acrLoginServer)/$(imageRepository):$(releaseVersion)"
          docker push "$(acrLoginServer)/$(imageRepository):latest"
          echo "Published $(acrLoginServer)/$(imageRepository):$(releaseVersion) (also tagged latest)"
        displayName: 'Push to ACR'

      # ── Deploy ────────────────────────────────────────────────────────────
      # Attaches the image to the existing web app and pushes the non-secret
      # application settings, exactly as budget does.
      #
      # appSettings ADDS/UPDATES only the keys listed. Settings not listed —
      # DB_PWD, JWT_SECRET_KEY, OAUTH2_CLIENT_SECRET and anything else set by
      # hand — are left untouched, which is what keeps secrets out of here.
      #
      # ⚠️ `cmms` is currently a *site containers* app (linuxFxVersion is the
      # literal string "sitecontainers"). This task sets linuxFxVersion to
      # DOCKER|<image>, which moves it to the classic single-container model.
      # Functionally the same for one container on port 8080, but it IS a change
      # to a hand-built app, and it happens on the first run. If you would
      # rather keep the site-containers shape, use the AzureCLI alternative
      # commented out below instead.
      - task: AzureWebAppContainer@1
        displayName: 'Deploy $(releaseVersion) to $(webAppName)'
        inputs:
          azureSubscription: '$(azureSubscriptionServiceConnection)'
          appName: '$(webAppName)'
          resourceGroupName: '$(webAppResourceGroup)'
          containers: '$(acrLoginServer)/$(imageRepository):$(releaseVersion)'
          appSettings: >-
            -WEBSITES_PORT $(websitesPort)
            -SPRING_PROFILES_ACTIVE $(springProfile)
            -DB_URL $(dbUrl)
            -DB_USER $(dbUser)
            -PUBLIC_API_URL $(publicUrl)
            -PUBLIC_FRONT_URL $(publicUrl)
            -STORAGE_TYPE $(storageType)
            -AZURE_STORAGE_ACCOUNT $(storageAccount)
            -AZURE_STORAGE_CONTAINER $(storageContainer)
            -AZURE_CLIENT_ID $(azureClientId)
            -ENABLE_SSO $(enableSso)
            -OAUTH2_PROVIDER $(oauth2Provider)
            -OAUTH2_CLIENT_ID $(oauth2ClientId)
            -OAUTH2_TENANT_ID $(oauth2TenantId)
            -MAIL_TYPE $(mailType)
            -SMTP_HOST $(smtpHost)
            -SMTP_PORT $(smtpPort)
            -SMTP_AUTH $(smtpAuth)
            -SMTP_STARTTLS $(smtpStartTls)
            -SMTP_FROM $(smtpFrom)
            -MAIL_RECIPIENTS $(mailRecipients)
            -ENABLE_EMAIL_NOTIFICATIONS $(enableEmail)
            -INVITATION_VIA_EMAIL $(invitationViaEmail)
            -ENABLE_CORS $(enableCors)
            -LOG_FILE $(logFile)
          restartApp: true

      # Alternative to the task above, for keeping `cmms` as a site containers
      # app: sets the image on the main site container instead of touching
      # linuxFxVersion. If you swap to this, the application settings need a
      # separate `az webapp config appsettings set` call.
      #
      # - task: AzureCLI@2
      #   displayName: 'Point the main site container at $(releaseVersion)'
      #   inputs:
      #     azureSubscription: '$(azureSubscriptionServiceConnection)'
      #     scriptType: bash
      #     scriptLocation: inlineScript
      #     inlineScript: |
      #       set -euo pipefail
      #       az webapp sitecontainers update \
      #         --name '$(webAppName)' --resource-group '$(webAppResourceGroup)' \
      #         --container-name '$(webAppName)' \
      #         --image '$(acrLoginServer)/$(imageRepository):$(releaseVersion)'
      #       az webapp restart --name '$(webAppName)' --resource-group '$(webAppResourceGroup)'

      # ── Confirm (informational only) ───────────────────────────────────────
      # This reports whether the site came back; it does NOT fail the release.
      # The deploy task returns as soon as the platform accepts the request, and
      # a container that fails to start leaves the previous one serving, so
      # without this there is no signal at all. It is capped at ~3 minutes
      # because the app needs roughly 90 s to reach "Started ApiApplication".
      - bash: |
          set -uo pipefail
          URL='$(publicUrl)'
          echo "Polling ${URL} for up to 3 minutes (informational)..."
          for i in $(seq 1 18); do
            BODY=$(curl -fsS --max-time 10 "${URL}/" 2>/dev/null) || BODY=""
            if echo "$BODY" | grep -q 'id="root"'; then
              echo "OK: ${URL} is serving the SPA after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "##vso[task.logissue type=warning]${URL} was not serving the SPA within 3 minutes. The release is still marked successful; check the container log below."
          exit 0
        displayName: 'Check the site (does not fail the release)'
        continueOnError: true

      # What tells you WHY a failed release failed. Always runs. The same output
      # is teed to $LOG_FILE inside the container, readable over SSH with
      # `az webapp ssh --name cmms --resource-group New-Implementations`.
      - task: AzureCLI@2
        displayName: 'Container startup log'
        condition: always()
        inputs:
          azureSubscription: '$(azureSubscriptionServiceConnection)'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -uo pipefail
            az webapp log download --name '$(webAppName)' --resource-group '$(webAppResourceGroup)' \
              --log-file "$(Agent.TempDirectory)/logs.zip" >/dev/null 2>&1 \
              && unzip -p "$(Agent.TempDirectory)/logs.zip" '*docker*' 2>/dev/null | tail -200 \
              || echo "Could not download the log bundle; check the Log stream blade."
