# Shared deploy steps for one environment: apply the OpenTofu config, then
# restart the web app so it pulls the digest the Build stage just pushed to
# the moving tag.
#
# Used by both the Test and Prod stages of azure-pipelines.yml. The only
# difference between them is the parameters below and, for prod, the approval
# gate that comes from the deployment job's environment.

parameters:
  - name: environmentName
    type: string
    values:
      - test
      - prod
  - name: webAppName
    type: string
  - name: publicUrl
    type: string
  - name: vnetSubnetId
    type: string

steps:
  - bash: |
      set -euo pipefail
      curl -fsSL -o /tmp/tofu.zip \
        "https://github.com/opentofu/opentofu/releases/download/v$(tofuVersion)/tofu_$(tofuVersion)_linux_amd64.zip"
      unzip -q -o /tmp/tofu.zip -d /tmp/tofu
      sudo install -m 0755 /tmp/tofu/tofu /usr/local/bin/tofu
      tofu version
    displayName: 'Install OpenTofu $(tofuVersion)'

  # addSpnToEnvironment exposes the service principal so the azurerm provider
  # and the azurerm state backend can both authenticate as it, rather than
  # relying on the ambient az login.
  - task: AzureCLI@2
    displayName: 'tofu plan (${{ parameters.environmentName }})'
    inputs:
      azureSubscription: '$(azureSubscriptionServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: 'infra/envs/${{ parameters.environmentName }}'
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_CLIENT_SECRET="$servicePrincipalKey"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        export TF_VAR_public_url='${{ parameters.publicUrl }}'
        export TF_VAR_vnet_integration_subnet_id='${{ parameters.vnetSubnetId }}'

        [ -n "$TF_VAR_vnet_integration_subnet_id" ] || {
          echo "##vso[task.logissue type=error]VNET_SUBNET_ID_${{ upper(parameters.environmentName) }} is not set. The app cannot reach the private database without regional VNet integration; see REQUIREMENTS.md."
          exit 1
        }

        tofu init -input=false
        tofu plan -input=false -lock-timeout=5m -out=tfplan
    env:
      # Not secret, but keep them out of the log echo above.
      TF_IN_AUTOMATION: 'true'

  - task: AzureCLI@2
    displayName: 'tofu apply (${{ parameters.environmentName }})'
    inputs:
      azureSubscription: '$(azureSubscriptionServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: 'infra/envs/${{ parameters.environmentName }}'
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_CLIENT_SECRET="$servicePrincipalKey"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        tofu apply -input=false -lock-timeout=5m -auto-approve tfplan
    env:
      TF_IN_AUTOMATION: 'true'

  # OpenTofu already points the app at cmms:<env>. That tag now carries a new
  # digest, and App Service re-pulls the tag on restart, so this is what
  # actually rolls the new build out.
  - task: AzureCLI@2
    displayName: 'Restart ${{ parameters.webAppName }} to pull the new image'
    inputs:
      azureSubscription: '$(azureSubscriptionServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az webapp restart --name '${{ parameters.webAppName }}' --resource-group '$(resourceGroup)'

  # The restart returns immediately. A container that fails to start leaves the
  # previous one serving, which looks like success, so confirm the live site
  # actually serves the SPA before calling the release good.
  - bash: |
      set -euo pipefail
      URL='${{ parameters.publicUrl }}'
      echo "Waiting for ${URL} to serve the SPA..."
      for i in $(seq 1 60); do
        BODY=$(curl -fsS --max-time 20 "${URL}/" 2>/dev/null) || BODY=""
        if echo "$BODY" | grep -q 'id="root"'; then
          echo "${URL} is serving the SPA after $((i * 10))s"
          exit 0
        fi
        sleep 10
      done
      echo "##vso[task.logissue type=error]${URL} did not serve the SPA within 10 minutes"
      exit 1
    displayName: 'Verify ${{ parameters.webAppName }} serves the SPA'
